name: test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - run: chmod +x scripts/test.sh && ./scripts/test.sh
  native-gateway:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2337570 = the historical pin. 77fb7f0 = the rev live on the kayhermes
        # gateway since 2026-09-17 23:08Z; it carries Hermes a10bbf95bb
        # (gateway.multiplex_profiles defaults on), which the old pin never
        # exercised -- the plugin refused to load on it for eight days.
        hermes_ref:
          - 233757037df1f03f9fe1cfddc097acd5ad7f7510
          - 77fb7f0a709b4df2c17822da3a08f8c93de3b3fb
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes_ref }}
          path: hermes-runtime
      - run: |
          python -m venv hermes-runtime/.venv
          hermes-runtime/.venv/bin/python -m pip install --disable-pip-version-check \
            -e './hermes-runtime[dev]' \
            -r plugin/requirements-native-test.txt
      - run: HERMES_SOURCE="$GITHUB_WORKSPACE/hermes-runtime" bash plugin/scripts/test-native.sh
