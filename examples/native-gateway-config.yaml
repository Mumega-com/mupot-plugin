# Merge into a dedicated operator profile; replace all placeholders.
# Credentials stay in its protected environment, never in this YAML.
plugins:
  enabled: [mupot]
  disabled: [platforms/mupot, mupot-platform]
  entries:
    mupot:
      allow_gateway_injection: true
      settings:
        mode: operator
        operator:
          native_gateway_enabled: true
          inbox_watch_enabled: false
          base_url: https://<YOUR_MUPOT_HOST>
          expected_tenant: <TENANT_SLUG>
          squad_id: <SQUAD_ID>
          agent_id: <HERMES_AGENT_ID>
          approval_owner: <HUMAN_APPROVAL_OWNER_ID>
          pubsub_peer_agent_ids: [<ALLOWED_PEER_AGENT_ID>]
          timeout: 20

mcp_servers:
  mupot:
    url: https://<YOUR_MUPOT_HOST>/mcp
    headers:
      Authorization: Bearer ${MUPOT_AGENT_TOKEN}

mupot:
  enabled: true
  mcp_server: mupot
  # During migration, use the exact existing path; do not start a new empty ledger.
  # Fresh installations may omit this and use the profile-aware default.
  state_path: <ABSOLUTE_PATH_TO_EXISTING_MUPOT_STATE_JSON>
  allowed_agents: [<ALLOWED_PEER_AGENT_ID>]
  notification_recipients:
    telegram: '<IMMUTABLE_TELEGRAM_USER_ID>'
  notification_activate: true

# Configure the Telegram bot and its human allowlist in this same profile.
# Start a private conversation once so Hermes has an authenticated session origin.
# Group destinations and unlinked users are not selected by this notification route.
