# Merge into a dedicated operator profile; replace all placeholders.
# Credentials stay in its protected environment, never in this YAML.
plugins:
  enabled: [mupot]
  disabled: [platforms/mupot, mupot-platform]
  entries:
    mupot:
      allow_gateway_injection: true
      settings:
        mode: operator
        operator:
          native_gateway_enabled: true
          inbox_watch_enabled: false
          # Hosted production Mupot. Keep this credential-free HTTPS origin exact.
          base_url: https://mupot.mumega.com
          telegram_control_enabled: true
          telegram_control_webhook_secret_env: IM_WEBHOOK_SECRET
          expected_tenant: <TENANT_SLUG>
          squad_id: <SQUAD_ID>
          agent_id: <HERMES_AGENT_ID>
          approval_owner: <HUMAN_APPROVAL_OWNER_ID>
          pubsub_peer_agent_ids: [<ALLOWED_PEER_AGENT_ID>]
          timeout: 20

mcp_servers:
  mupot:
    url: https://mupot.mumega.com/mcp
    headers:
      Authorization: Bearer ${MUPOT_AGENT_TOKEN}

mupot:
  enabled: true
  mcp_server: mupot
  # Dedicated synthetic Routine human-wait receiver; this does not widen allowed_agents.
  routine_events_enabled: true
  # During migration, use the exact existing path; do not start a new empty ledger.
  # Fresh installations may omit this and use the profile-aware default.
  state_path: <ABSOLUTE_PATH_TO_EXISTING_MUPOT_STATE_JSON>
  # Comma-separated string or a list; each entry is lowercased and has one leading
  # "agent:" prefix stripped before comparison. An explicit empty value ([] or "")
  # means deny-all and is honored as written. Only a genuinely ABSENT key falls back
  # to the default four-agent roster (hadi-codex,hadi-codex-cli,kasra,hermes) -- set
  # this explicitly for a real deployment rather than relying on that default.
  allowed_agents: [<ALLOWED_PEER_AGENT_ID>]
  notification_recipients:
    telegram: '<IMMUTABLE_TELEGRAM_USER_ID>'
  notification_activate: true
  # Event-based wake (optional). Holds GET /api/inbox/stream open with the same
  # agent bearer (URL derived from mcp_servers.<mcp_server>.url) and wakes the
  # lease loop on each new message. The stream never consumes or acks; all
  # custody stays on inbox_lease/inbox_lease_ack. Works in bearer_only mode.
  sse_wake_enabled: true
  poll_interval: 2                 # used while the stream is down / draining
  sse_safety_poll_interval: 60     # timed poll while the stream is healthy
  # sse_idle_timeout: 45           # no frame or ': ping' for this long -> reconnect
  # sse_backoff_cap: 60            # reconnect backoff ceiling (seconds, jittered)
  # sse_poll_ms: 1000              # server-side stream cadence hint
  # lease_self_heal_interval: 60   # first in-process retry after a lease quarantine
  # lease_self_heal_cap: 900

# Configure exactly one Telegram bot in this profile. This one Mupot plugin owns
# the one native receiver and the deterministic Telegram handlers; do not install
# a second Mupot receiver or attach another Telegram bot to the same profile.
# Configure the bot's human allowlist in this same profile.
# Start a private conversation once so Hermes has an authenticated session origin.
# Group destinations and unlinked users are not selected by this notification route.
